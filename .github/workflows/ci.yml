# Typecheck, lint, test, and build on every push and pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    name: Site — check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check --workspace site
      - run: npm run build --workspace site

  e2e:
    name: Site — e2e + accessibility (Playwright, axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: npm run test:e2e --workspace site
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: site/test-results/
          retention-days: 7

  engine:
    name: Tax engine — test + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test --workspace @taxline/tax-engine
      - run: npm --prefix packages/tax-engine run typecheck

  cms:
    name: CMS (EmDash) — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cms/package-lock.json
      - run: npm ci
        working-directory: cms
      - run: npm run typecheck
        working-directory: cms
      - run: npm run build
        working-directory: cms

  lint:
    name: Lint and format (eslint, prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  service:
    name: Service tests and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
        working-directory: service
      - run: npm test
        working-directory: service
      - run: npm run typecheck
        working-directory: service

  worker:
    name: 'Worker: test + typecheck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/contact/package-lock.json
      - run: npm ci
        working-directory: workers/contact
      - run: npm test
        working-directory: workers/contact
      - run: npm run typecheck
        working-directory: workers/contact

  python:
    name: 'Python: lint, types, tests, parity (${{ matrix.python }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    env:
      UV_PYTHON: ${{ matrix.python }}
      # The parity tests run the TypeScript engine through Node; never skip them here.
      TAXLINE_PARITY_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv sync --locked
        working-directory: python
      - run: uv run ruff check .
        working-directory: python
      - run: uv run ruff format --check .
        working-directory: python
      - run: uv run mypy
        working-directory: python
      - run: uv run pytest
        working-directory: python
