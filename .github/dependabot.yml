# Weekly dependency updates, grouped so minor and patch bumps land together.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint and @astrojs/check do not support TypeScript 7 yet.
      - dependency-name: typescript
        versions: ['>=7']
      # Keep Node types on the Node 22 line that CI and engines target.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: '/service'
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Keep Node types on the Node 22 line that CI and engines target.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: '/workers/contact'
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: '/cms'
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @astrojs/check does not support TypeScript 7 yet.
      - dependency-name: typescript
        versions: ['>=7']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
