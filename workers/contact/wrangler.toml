name = "taxline-contact"
main = "src/index.ts"
compatibility_date = "2026-05-01"

[vars]
# Origin allowed to call this Worker (the GitHub Pages site). Override per
# environment if the site moves to a custom domain.
ALLOWED_ORIGIN = "https://patrickking67.github.io"

# SLACK_WEBHOOK is a SECRET, not a plain var. Set it with:
#   wrangler secret put SLACK_WEBHOOK
# Leaving it unset disables Slack notifications (storage still works).

# KV namespace for stored leads. Create it once, then uncomment and paste the id:
#   wrangler kv namespace create LEADS
# [[kv_namespaces]]
# binding = "LEADS"
# id = "<your-kv-namespace-id>"
